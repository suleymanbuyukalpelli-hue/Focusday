<!doctype html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1769AA">
<title>FocusDay</title>
<style>
:root{--blue:#1769AA;--green:#5E8C61;--yellow:#E4C441;--orange:#E58B32;--purple:#7656A6;--red:#C94C4C;--ink:#17212B;--bg:#F4F7F8;--muted:#71808A}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button,input,select{font:inherit}button{cursor:pointer}.app{max-width:520px;min-height:100vh;margin:auto;padding-bottom:90px}.top{height:70px;padding:14px 18px;background:#fff;border-bottom:1px solid #e6ecee;display:flex;align-items:center;gap:10px}.logo{width:40px;height:40px;border-radius:12px;background:var(--blue);color:#fff;display:grid;place-items:center;font-weight:800;font-size:22px}.top b{font-size:17px}.top small{display:block;color:var(--muted)}main{padding:20px 17px}.eyebrow{margin:0 0 5px;color:var(--blue);font-size:12px;font-weight:700;letter-spacing:.6px;text-transform:uppercase}h1{font-size:27px;margin:3px 0 6px}h2{font-size:16px;margin:0 0 13px}.welcome p:last-child{color:var(--muted);margin:0 0 19px}.card,.progress,.timer{background:#fff;border-radius:20px;padding:17px;margin:14px 0;box-shadow:0 4px 18px #17212b0d}.progress{background:var(--ink);color:#fff;display:flex;align-items:center;justify-content:space-between}.progress .eyebrow{color:var(--yellow)}.progress h2{font-size:18px}.line{width:180px;height:7px;margin:10px 0;background:#42515b;border-radius:9px;overflow:hidden}.line span{display:block;height:100%;background:var(--green)}.progress small{color:#c8d1d5}.ring{width:76px;height:76px;border-radius:50%;display:grid;place-items:center;position:relative;background:conic-gradient(var(--yellow) var(--p),#42515b 0)}.ring:after{content:"";position:absolute;inset:8px;border-radius:50%;background:var(--ink)}.ring b{position:relative;z-index:1}.heading,.title{display:flex;align-items:center;justify-content:space-between}.heading button{border:0;background:none;color:var(--blue);font-size:12px;font-weight:700}.row{min-height:56px;border-top:1px solid #edf1f2;display:flex;align-items:center;gap:11px}.row:first-of-type{border-top:0}.check{width:25px;height:25px;border:2px solid #b9c8cc;border-radius:50%;background:#fff;color:#fff}.check.done{background:var(--green);border-color:var(--green)}.info{flex:1}.row strong{display:block;font-size:14px}.row small{display:block;margin-top:3px;color:var(--muted);font-size:12px}.done-text{text-decoration:line-through;color:var(--muted)}.delete{border:1px solid var(--red);border-radius:8px;padding:7px 9px;background:#fff;color:var(--red);font-size:12px}.clock{width:31px;height:31px;border-radius:10px;background:#fff0df;color:var(--orange);display:grid;place-items:center;font-size:19px}.row time{font-size:13px;font-weight:700}.primary,.secondary{min-height:45px;padding:0 17px;border:0;border-radius:12px;font-weight:700}.primary{background:var(--blue);color:#fff}.secondary{background:#e8f1f7;color:var(--blue)}.wide{width:100%;margin-top:6px}.plus{border:0;background:none;color:var(--blue);font-size:28px}.tabs{display:flex;gap:7px;overflow:auto;margin:0 0 15px}.tabs button{padding:10px 13px;border:0;border-radius:20px;background:#e6ecee;color:var(--muted);white-space:nowrap}.tabs .active{background:var(--blue);color:#fff}.form{display:grid;gap:8px}.form label{margin-top:6px;color:#53636c;font-size:13px;font-weight:700}.form input,.form select,.add input,.timer input,.period{width:100%;min-height:45px;padding:0 12px;border:1px solid #dce5e7;border-radius:10px;background:#fff;color:var(--ink)}.add{display:flex;gap:8px}.add input{flex:1;min-width:0}.timer{text-align:center;padding:27px 17px}.timer-ring{width:225px;height:225px;margin:13px auto 22px;border:12px solid var(--yellow);border-right-color:var(--blue);border-radius:50%;display:flex;flex-direction:column;justify-content:center}.timer-ring strong{font-size:43px}.timer-ring span{color:var(--muted);font-size:13px}.actions{display:flex;gap:8px;margin-top:12px}.actions>*{flex:1}.session{color:var(--muted);font-size:13px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.stat{min-height:105px;padding:13px 10px;border-top:4px solid var(--blue);border-radius:15px;background:#fff;display:flex;flex-direction:column;justify-content:space-between}.stat b{font-size:22px}.stat small{color:var(--muted);line-height:1.2}.green{border-color:var(--green)}.purple{border-color:var(--purple)}.chart{height:185px;display:flex;align-items:end;justify-content:space-around;gap:8px}.col{height:100%;flex:1;display:flex;flex-direction:column;align-items:center;justify-content:end;gap:8px}.bar{width:19px;min-height:25px;border-radius:7px 7px 2px 2px}.b1{background:var(--blue)}.b2{background:var(--green)}.b3{background:var(--yellow)}.col small{color:var(--muted);font-size:11px}.insight{padding:16px;border-radius:15px;background:#eee9f6;color:var(--purple);font-size:13px;line-height:1.5}.empty{padding:10px 0;color:var(--muted);font-size:14px}.nav{position:fixed;z-index:3;bottom:0;left:50%;width:100%;max-width:520px;transform:translateX(-50%);padding:8px 4px max(8px,env(safe-area-inset-bottom));border-top:1px solid #e6ecee;background:#fffffff7;display:grid;grid-template-columns:repeat(5,1fr)}.nav button{border:0;background:none;color:#8a989e;font-size:10px;display:flex;flex-direction:column;align-items:center;gap:4px}.nav span{font-size:20px;line-height:20px}.nav .sel{color:var(--blue);font-weight:700}.modal-bg{position:fixed;z-index:10;inset:0;padding:20px;background:#17212b88;display:grid;place-items:center}.modal{width:min(90%,360px);padding:22px;border-radius:20px;background:#fff;box-shadow:0 12px 40px #0004}.modal h2{font-size:20px;margin-bottom:8px}.modal p{margin:0 0 20px;color:var(--muted);line-height:1.45}.modal-actions{display:flex;justify-content:flex-end;gap:10px}.modal-actions button{min-height:42px;padding:0 16px;border-radius:10px;font-weight:700}.cancel{border:0;background:#e8f1f7;color:var(--blue)}.danger{border:0;background:var(--red);color:#fff}@media(min-width:700px){body{padding:24px}.app{border-radius:24px;overflow:hidden;box-shadow:0 8px 35px #17212b1a}}
</style>
</head>
<body>
<div class="app"><header class="top"><div class="logo">F</div><div><b>FocusDay</b><small>Gününü odakla</small></div></header><main id="main"></main><nav class="nav" id="nav"></nav></div>
<script>
const today=new Date().toISOString().slice(0,10);let goals=JSON.parse(localStorage.getItem('fd-goals')||'null')||[{id:1,title:'Raporu tamamla',done:true,repeat:'Tek seferlik'},{id:2,title:'İngilizce çalış',done:false,repeat:'Her gün'}];let reminders=JSON.parse(localStorage.getItem('fd-reminders')||'null')||[{id:1,title:'Haftalık toplantı',time:'09:00',repeat:'Her Salı'}];let screen='home',seconds=1500,running=false,pomos=+localStorage.getItem('fd-pomos')||0,pending=null;
const save=()=>{localStorage.setItem('fd-goals',JSON.stringify(goals));localStorage.setItem('fd-reminders',JSON.stringify(reminders));localStorage.setItem('fd-pomos',pomos)};const dateText=new Intl.DateTimeFormat('tr-TR',{day:'numeric',month:'long',year:'numeric'}).format(new Date());
function goalRow(g,del=true){return `<div class="row"><button class="check ${g.done?'done':''}" onclick="toggle(${g.id})">${g.done?'✓':''}</button><div class="info"><strong class="${g.done?'done-text':''}">${g.title}</strong><small>${g.repeat}</small></div>${del?`<button class="delete" onclick="askDelete('goal',${g.id})">Sil</button>`:''}</div>`}function reminderRow(r){return `<div class="row"><span class="clock">◷</span><div class="info"><strong>${r.title}</strong><small>${r.repeat}</small></div><time>${r.time}</time><button class="delete" onclick="askDelete('reminder',${r.id})">Sil</button></div>`}
function home(){let d=goals.filter(g=>g.done).length,p=goals.length?Math.round(d/goals.length*100):0;return `<section class="welcome"><p class="eyebrow">${dateText}</p><h1>Günaydın, Süleyman</h1><p>Bugün neye odaklanmak istersin?</p></section><section class="progress"><div><p class="eyebrow">Bugünkü ilerlemen</p><h2>${d} / ${goals.length} hedef tamamlandı</h2><div class="line"><span style="width:${p}%"></span></div><small>${p}% tamamlandı</small></div><div class="ring" style="--p:${p*3.6}deg"><b>${p}%</b></div></section><section class="card"><div class="heading"><h2>Bugünün hedefleri</h2><button onclick="go('goals')">Tümünü gör</button></div>${goals.length?goals.slice(0,3).map(g=>goalRow(g,false)).join(''):'<p class="empty">Henüz hedef yok.</p>'}</section><section class="card"><div class="heading"><h2>Yaklaşan hatırlatmalar</h2><button onclick="go('reminders')">Tümünü gör</button></div>${reminders.length?reminders.map(reminderRow).join(''):'<p class="empty">Henüz hatırlatma yok.</p>'}</section><button class="primary wide" onclick="go('pomodoro')">▶ Pomodoro başlat</button>`}
function goalsPage(){return `<div class="title"><h1>Hedefler</h1></div><div class="tabs"><button class="active">Bugün</button><button>Yaklaşan</button><button>Tamamlanan</button></div><section class="card">${goals.length?goals.map(g=>goalRow(g)).join(''):'<p class="empty">Henüz hedef yok.</p>'}</section><div class="add"><input id="goalInput" placeholder="Yeni hedef yaz..." onkeydown="if(event.key==='Enter')addGoal()"><button class="primary" onclick="addGoal()">Ekle</button></div>`}
function remindersPage(){return `<div class="title"><h1>Yeni Hatırlatma</h1></div><section class="card form"><label>Hatırlatma başlığı</label><input id="rtitle" placeholder="Örn. Haftalık toplantı"><label>Başlangıç tarihi</label><input type="date" value="${today}"><label>Saat</label><input id="rtime" type="time" value="09:00"><label>Tekrar</label><select id="rrepeat"><option>Tek seferlik</option><option>Her gün</option><option>Her hafta</option><option>Her ay</option></select><button class="primary wide" onclick="addReminder()">Hatırlatmayı kaydet</button></section><section class="card">${reminders.length?reminders.map(reminderRow).join(''):'<p class="empty">Henüz hatırlatma yok.</p>'}</section>`}
function pomo(){let m=String(Math.floor(seconds/60)).padStart(2,'0'),s=String(seconds%60).padStart(2,'0');return `<div class="title"><h1>Pomodoro</h1></div><section class="timer"><p class="eyebrow">Bağımsız odaklanma</p><div class="timer-ring"><strong>${m}:${s}</strong><span>${running?'Odaklanıyor':'Başlamaya hazır'}</span></div><input placeholder="Odaklanma konusu (isteğe bağlı)"><div class="actions"><button class="primary" onclick="run()">${running?'❚❚ Duraklat':'▶ Başlat'}</button><button class="secondary" onclick="resetTimer()">Sıfırla</button></div><p class="session">Tamamlanan Pomodoro: <b>${pomos}</b></p></section>`}function reports(){let d=goals.filter(g=>g.done).length;return `<div class="title"><h1>Raporlar</h1></div><select class="period"><option>Bu hafta</option><option>Bu ay</option></select><div class="stats"><div class="stat green"><b>${d}</b><small>Tamamlanan hedefler</small></div><div class="stat"><b>${pomos}</b><small>Pomodoro</small></div><div class="stat purple"><b>${pomos*25} dk</b><small>Odaklanma süresi</small></div></div><section class="card"><h2>Haftalık odaklanma</h2><div class="chart">${['Pzt','Sal','Çar','Per','Cum','Cmt','Paz'].map((x,i)=>`<div class="col"><div class="bar b${i%3+1}" style="height:${30+(i*13)%65}%"></div><small>${x}</small></div>`).join('')}</div></section><div class="insight">✦ Bu hafta düzenli ilerliyorsun. Küçük adımlar büyük sonuçlar getirir.</div>`}
function render(){document.getElementById('main').innerHTML=screen==='home'?home():screen==='goals'?goalsPage():screen==='reminders'?remindersPage():screen==='pomodoro'?pomo():reports();let items=[['home','⌂','Ana Sayfa'],['goals','✓','Hedefler'],['reminders','◷','Hatırlatmalar'],['pomodoro','◉','Pomodoro'],['reports','▥','Raporlar']];document.getElementById('nav').innerHTML=items.map(x=>`<button class="${screen===x[0]?'sel':''}" onclick="go('${x[0]}')"><span>${x[1]}</span>${x[2]}</button>`).join('')}
function go(x){screen=x;render()}function toggle(id){goals=goals.map(g=>g.id===id?{...g,done:!g.done}:g);save();render()}function askDelete(type,id){pending={type,id};const item=type==='goal'?goals.find(x=>x.id===id):reminders.find(x=>x.id===id);const label=type==='goal'?'Hedefi sil?':'Hatırlatmayı sil?';document.body.insertAdjacentHTML('beforeend',`<div class="modal-bg" id="modal"><div class="modal"><h2>${label}</h2><p>“${item.title}” ${type==='goal'?'hedefi':'hatırlatması'} silinecek. Bu işlem geri alınamaz.</p><div class="modal-actions"><button class="cancel" onclick="closeModal()">İptal</button><button class="danger" onclick="confirmDelete()">Sil</button></div></div></div>`)}function closeModal(){document.getElementById('modal')?.remove();pending=null}function confirmDelete(){if(!pending)return;if(pending.type==='goal')goals=goals.filter(x=>x.id!==pending.id);else reminders=reminders.filter(x=>x.id!==pending.id);save();closeModal();render()}function addGoal(){const el=document.getElementById('goalInput');if(!el.value.trim())return;goals.push({id:Date.now(),title:el.value.trim(),done:false,repeat:'Tek seferlik'});save();render()}function addReminder(){const t=document.getElementById('rtitle').value.trim();if(!t)return;reminders.push({id:Date.now(),title:t,time:document.getElementById('rtime').value,repeat:document.getElementById('rrepeat').value});save();render()}function run(){running=!running;render()}function resetTimer(){running=false;seconds=1500;render()}setInterval(()=>{if(running){seconds--;if(seconds<=0){seconds=1500;running=false;pomos++;save()}render()}},1000);render();
</script>
</body>
</html>
