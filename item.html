<!doctype html><html lang="tr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#1769AA"><title>FocusDay</title><style>:root{--b:#1769AA;--g:#5E8C61;--y:#E4C441;--o:#E58B32;--p:#7656A6;--r:#C94C4C;--i:#17212B;--bg:#F4F7F8;--m:#71808A}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--i);font:16px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.app{max-width:520px;margin:auto;min-height:100vh;padding-bottom:85px}.top{height:70px;background:#fff;display:flex;align-items:center;gap:10px;padding:14px 18px;border-bottom:1px solid #e6ecee}.logo{width:40px;height:40px;border-radius:12px;background:var(--b);color:#fff;display:grid;place-items:center;font-weight:800;font-size:22px}.top small{display:block;color:var(--m)}main{padding:20px 17px}h1{font-size:27px;margin:3px 0 18px}h2{font-size:16px;margin:0 0 12px}.ey{color:var(--b);font-size:12px;font-weight:700;text-transform:uppercase}.card,.prog,.timer{background:#fff;border-radius:20px;padding:17px;margin:14px 0;box-shadow:0 4px 18px #17212b0d}.prog{background:var(--i);color:#fff;display:flex;justify-content:space-between;align-items:center}.prog .ey{color:var(--y)}.line{width:180px;height:7px;background:#42515b;border-radius:8px;overflow:hidden}.line span{display:block;height:100%;background:var(--g)}.ring{width:72px;height:72px;border-radius:50%;display:grid;place-items:center;background:conic-gradient(var(--y) var(--pc),#42515b 0);position:relative}.ring:after{content:"";position:absolute;inset:8px;background:var(--i);border-radius:50%}.ring b{position:relative;z-index:1}.head{display:flex;justify-content:space-between}.head button{border:0;background:none;color:var(--b);font-size:12px;font-weight:700}.row{min-height:58px;border-top:1px solid #edf1f2;display:flex;align-items:center;gap:10px}.row:first-of-type{border-top:0}.info{flex:1}.check{width:25px;height:25px;border:2px solid #b9c8cc;border-radius:50%;background:#fff;color:#fff}.check.done{background:var(--g);border-color:var(--g)}.row strong{display:block;font-size:14px}.row small{display:block;color:var(--m);font-size:12px;margin-top:3px}.done{text-decoration:line-through;color:var(--m)}.del{border:1px solid var(--r);background:#fff;color:var(--r);border-radius:8px;padding:7px 10px;font-weight:700;font-size:12px}.clock{color:var(--o);background:#fff0df;border-radius:10px;padding:7px}.primary,.secondary{min-height:45px;border:0;border-radius:12px;padding:0 17px;font-weight:700}.primary{background:var(--b);color:#fff}.secondary{background:#e8f1f7;color:var(--b)}.wide{width:100%;margin-top:6px}.tabs{display:flex;gap:7px;margin-bottom:15px}.tabs button{border:0;border-radius:20px;padding:10px 13px;color:var(--m)}.tabs .active{background:var(--b);color:#fff}.form{display:grid;gap:8px}.form label{font-size:13px;font-weight:700;color:#53636c;margin-top:5px}.form input,.form select,.add input,.timer input{width:100%;min-height:45px;padding:0 12px;border:1px solid #dce5e7;border-radius:10px;background:#fff}.add{display:flex;gap:8px}.add input{flex:1}.timer{text-align:center}.timer-ring{width:220px;height:220px;margin:15px auto 22px;border:12px solid var(--y);border-right-color:var(--b);border-radius:50%;display:grid;place-items:center}.timer-ring strong{font-size:42px}.actions{display:flex;gap:8px;margin-top:12px}.actions>*{flex:1}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.stat{background:#fff;border-top:4px solid var(--b);border-radius:15px;padding:13px 10px;min-height:100px;display:flex;flex-direction:column;justify-content:space-between}.stat small{color:var(--m)}.green{border-color:var(--g)}.purple{border-color:var(--p)}.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:520px;background:#fffffff7;border-top:1px solid #e6ecee;display:grid;grid-template-columns:repeat(5,1fr);padding:8px 3px}.nav button{border:0;background:none;color:#8a989e;font-size:10px;display:flex;flex-direction:column;align-items:center;gap:4px}.nav span{font-size:20px}.nav .sel{color:var(--b);font-weight:700}.modalbg{position:fixed;inset:0;background:#17212b88;display:grid;place-items:center;padding:20px}.modal{max-width:360px;background:#fff;border-radius:20px;padding:22px}.modal p{color:var(--m);line-height:1.45}.ma{text-align:right}.ma button{border:0;border-radius:10px;padding:11px 16px;margin-left:8px;font-weight:700}.cancel{color:var(--b)}.danger{background:var(--r);color:#fff}</style></head><body><div class="app"><header class="top"><div class="logo">F</div><div><b>FocusDay</b><small>Gününü odakla</small></div></header><main id="main"></main><nav class="nav" id="nav"></nav></div><script>
const today=new Date().toISOString().slice(0,10);let goals=JSON.parse(localStorage.fdGoals||'null')||[{id:1,title:'Raporu tamamla',done:true,repeat:'Tek seferlik'},{id:2,title:'İngilizce çalış',done:false,repeat:'Her gün'}],rem=JSON.parse(localStorage.fdRem||'null')||[{id:1,title:'Haftalık toplantı',time:'09:00',repeat:'Her Salı'}],page='home',sec=1500,run=false,pom=+localStorage.fdPom||0,pending=null;const esc=x=>String(x).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function save(){localStorage.fdGoals=JSON.stringify(goals);localStorage.fdRem=JSON.stringify(rem);localStorage.fdPom=pom}function nav(){let a=[['home','⌂','Ana Sayfa'],['goals','✓','Hedefler'],['rem','◷','Hatırlatmalar'],['pomo','◉','Pomodoro'],['report','▥','Raporlar']];navEl.innerHTML=a.map(x=>`<button class="${page==x[0]?'sel':''}" onclick="go('${x[0]}')"><span>${x[1]}</span>${x[2]}</button>`).join('')}let navEl=document.getElementById('nav'),main=document.getElementById('main');function grow(g,d){return `<div class="row"><button class="check ${g.done?'done':''}" onclick="toggle(${g.id})">${g.done?'✓':''}</button><div class="info"><strong class="${g.done?'done':''}">${esc(g.title)}</strong><small>${esc(g.repeat)}</small></div>${d?`<button class="del" onclick="ask('g',${g.id})">Sil</button>`:''}</div>`}function rrow(r){return `<div class="row"><span class="clock">◷</span><div class="info"><strong>${esc(r.title)}</strong><small>${esc(r.repeat)}</small></div><b>${esc(r.time)}</b><button class="del" onclick="ask('r',${r.id})">Sil</button></div>`}function home(){let n=goals.filter(x=>x.done).length,p=goals.length?Math.round(n/goals.length*100):0;return `<p class="ey">Bugün</p><h1>Günaydın, Süleyman</h1><p style="color:var(--m)">Bugün neye odaklanmak istersin?</p><section class="prog"><div><p class="ey">İlerlemen</p><h2>${n}/${goals.length} hedef tamamlandı</h2><div class="line"><span style="width:${p}%"></span></div></div><div class="ring" style="--pc:${p*3.6}deg"><b>${p}%</b></div></section><section class="card"><div class="head"><h2>Bugünün hedefleri</h2><button onclick="go('goals')">Tümünü gör</button></div>${goals.slice(0,3).map(x=>grow(x,0)).join('')}</section><section class="card"><h2>Yaklaşan hatırlatmalar</h2>${rem.map(rrow).join('')}</section><button class="primary wide" onclick="go('pomo')">▶ Pomodoro başlat</button>`}function goals(){return `<h1>Hedefler</h1><div class="tabs"><button class="active">Bugün</button><button>Yaklaşan</button><button>Tamamlanan</button></div><section class="card">${goals.length?goals.map(x=>grow(x,1)).join(''):'Henüz hedef yok.'}</section><div class="add"><input id="gi" placeholder="Yeni hedef yaz..." onkeydown="if(event.key=='Enter')addG()"><button class="primary" onclick="addG()">Ekle</button></div>`}function reminders(){return `<h1>Hatırlatmalar</h1><section class="card form"><label>Başlık</label><input id="ri" placeholder="Örn. Haftalık toplantı"><label>Saat</label><input id="rt" type="time" value="09:00"><label>Tekrar</label><select id="rr"><option>Tek seferlik</option><option>Her gün</option><option>Her hafta</option><option>Her ay</option></select><button class="primary wide" onclick="addR()">Hatırlatmayı kaydet</button></section><section class="card">${rem.map(rrow).join('')}</section>`}function pomPage(){let m=String(Math.floor(sec/60)).padStart(2,'0'),s=String(sec%60).padStart(2,'0');return `<h1>Pomodoro</h1><section class="timer"><p class="ey">Bağımsız odaklanma</p><div class="timer-ring"><strong>${m}:${s}</strong></div><div class="actions"><button class="primary" onclick="run=!run;render()">${run?'Duraklat':'Başlat'}</button><button class="secondary" onclick="run=false;sec=1500;render()">Sıfırla</button></div><p style="color:var(--m)">Tamamlanan: ${pom}</p></section>`}function report(){return `<h1>Raporlar</h1><div class="stats"><div class="stat green"><b>${goals.filter(x=>x.done).length}</b><small>Tamamlanan hedef</small></div><div class="stat"><b>${pom}</b><small>Pomodoro</small></div><div class="stat purple"><b>${pom*25} dk</b><small>Odaklanma</small></div></div>`}function render(){main.innerHTML=page=='home'?home():page=='goals'?goals():page=='rem'?reminders():page=='pomo'?pomPage():report();nav()}function go(x){page=x;render()}function toggle(id){goals=goals.map(x=>x.id==id?{...x,done:!x.done}:x);save();render()}function ask(t,id){let item=t=='g'?goals.find(x=>x.id==id):rem.find(x=>x.id==id);pending={t,id};document.body.insertAdjacentHTML('beforeend',`<div class="modalbg" id="modal"><div class="modal"><h2>${t=='g'?'Hedefi sil?':'Hatırlatmayı sil?'}</h2><p>“${esc(item.title)}” silinecek. Bu işlem geri alınamaz.</p><div class="ma"><button class="cancel" onclick="closeM()">İptal</button><button class="danger" onclick="confirmD()">Sil</button></div></div></div>`)}function closeM(){document.getElementById('modal')?.remove();pending=null}function confirmD(){if(pending.t=='g')goals=goals.filter(x=>x.id!=pending.id);else rem=rem.filter(x=>x.id!=pending.id);save();closeM();render()}function addG(){let x=document.getElementById('gi');if(x.value.trim()){goals.push({id:Date.now(),title:x.value.trim(),done:false,repeat:'Tek seferlik'});save();render()}}function addR(){let x=document.getElementById('ri');if(x.value.trim()){rem.push({id:Date.now(),title:x.value.trim(),time:document.getElementById('rt').value,repeat:document.getElementById('rr').value});save();render()}}setInterval(()=>{if(run){sec--;if(sec<=0){sec=1500;run=false;pom++;save()}render()}},1000);render();</script></body></html>
