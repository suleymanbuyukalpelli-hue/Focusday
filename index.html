<!doctype html>
<html lang="tr">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#1769AA"><title>FocusDay</title>
<style>
:root{--blue:#1769AA;--green:#5E8C61;--yellow:#E4C441;--orange:#E58B32;--purple:#7656A6;--red:#C94C4C;--ink:#17212B;--bg:#F4F7F8;--muted:#71808A}*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--ink)}button,input,select{font:inherit}button{border:0;cursor:pointer}.app{max-width:520px;min-height:100vh;margin:auto;padding-bottom:88px}.top{height:70px;background:#fff;border-bottom:1px solid #e6ecee;display:flex;align-items:center;padding:14px 18px;gap:10px}.logo{width:40px;height:40px;border-radius:12px;background:var(--blue);color:#fff;display:grid;place-items:center;font-weight:800;font-size:22px}.top b{font-size:17px}.top small{display:block;color:var(--muted)}.bell{margin-left:auto;background:none;color:var(--blue);font-size:24px}main{padding:20px 17px}.eyebrow{font-size:12px;text-transform:uppercase;letter-spacing:.6px;font-weight:700;color:var(--blue);margin:0 0 5px}h1{font-size:27px;margin:3px 0 6px;letter-spacing:-.5px}h2{font-size:16px;margin:0 0 13px}.welcome p:last-child{color:var(--muted);margin:0 0 19px}.card,.progress,.timer{background:#fff;border-radius:20px;padding:17px;margin:14px 0;box-shadow:0 4px 18px #17212b0d}.progress{background:var(--ink);color:#fff;display:flex;justify-content:space-between;align-items:center}.progress h2{font-size:18px}.progress .eyebrow{color:var(--yellow)}.line{height:7px;width:180px;background:#42515b;border-radius:9px;overflow:hidden;margin:10px 0}.line span{display:block;height:100%;background:var(--green)}.progress small{color:#c8d1d5}.ring{width:76px;height:76px;border-radius:50%;background:conic-gradient(var(--yellow) var(--p),#42515b 0);display:grid;place-items:center;position:relative}.ring:after{content:"";position:absolute;inset:8px;border-radius:50%;background:var(--ink)}.ring b{position:relative;z-index:1}.heading{display:flex;justify-content:space-between}.heading button,.link{background:none;color:var(--blue);font-size:12px;font-weight:700}.row{display:flex;align-items:center;gap:11px;min-height:56px;border-top:1px solid #edf1f2}.row:first-of-type{border-top:0}.check{width:25px;height:25px;border-radius:50%;border:2px solid #b9c8cc;background:#fff;color:#fff}.check.done{background:var(--green);border-color:var(--green)}.row strong{display:block;font-size:14px}.row small{color:var(--muted);font-size:12px;display:block;margin-top:3px}.done-text{text-decoration:line-through;color:var(--muted)}.clock{width:31px;height:31px;border-radius:10px;background:#fff0df;color:var(--orange);display:grid;place-items:center;font-size:19px}.row time{margin-left:auto;font-weight:700;font-size:13px}.primary,.secondary{min-height:45px;padding:0 17px;border-radius:12px;font-weight:700}.primary{background:var(--blue);color:#fff}.secondary{background:#e8f1f7;color:var(--blue)}.wide{width:100%;margin-top:6px}.title{display:flex;justify-content:space-between;align-items:center}.title h1{margin-bottom:18px}.plus{font-size:28px;color:var(--blue);background:none}.tabs{display:flex;gap:7px;overflow:auto;margin:0 0 15px}.tabs button{padding:10px 13px;border-radius:20px;background:#e6ecee;color:var(--muted);white-space:nowrap}.tabs .active{background:var(--blue);color:#fff}.form{display:grid;gap:8px}.form label{font-size:13px;font-weight:700;color:#53636c;margin-top:6px}.form input,.form select,.add input,.timer input,.period{width:100%;min-height:45px;border:1px solid #dce5e7;border-radius:10px;padding:0 12px;background:#fff;color:var(--ink)}.add{display:flex;gap:8px}.add input{flex:1;min-width:0}.timer{text-align:center;padding:27px 17px}.timer-ring{width:225px;height:225px;margin:13px auto 22px;border:12px solid var(--yellow);border-right-color:var(--blue);border-radius:50%;display:flex;flex-direction:column;justify-content:center}.timer-ring strong{font-size:43px}.timer-ring span{font-size:13px;color:var(--muted)}.actions{display:flex;gap:8px;margin-top:12px}.actions>*{flex:1}.session{color:var(--muted);font-size:13px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.stat{background:#fff;border-top:4px solid var(--blue);border-radius:15px;padding:13px 10px;min-height:105px;display:flex;flex-direction:column;justify-content:space-between}.stat b{font-size:22px}.stat small{color:var(--muted);line-height:1.2}.green{border-color:var(--green)}.purple{border-color:var(--purple)}.chart{height:185px;display:flex;align-items:end;justify-content:space-around;gap:8px}.col{height:100%;flex:1;display:flex;flex-direction:column;justify-content:end;align-items:center;gap:8px}.bar{width:19px;border-radius:7px 7px 2px 2px;min-height:25px}.b1{background:var(--blue)}.b2{background:var(--green)}.b3{background:var(--yellow)}.col small{color:var(--muted);font-size:11px}.insight{background:#eee9f6;color:var(--purple);border-radius:15px;padding:16px;font-size:13px;line-height:1.5}.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:520px;background:#fffffff7;border-top:1px solid #e6ecee;display:grid;grid-template-columns:repeat(5,1fr);padding:8px 4px max(8px,env(safe-area-inset-bottom));z-index:3}.nav button{background:none;color:#8a989e;font-size:10px;display:flex;flex-direction:column;align-items:center;gap:4px}.nav span{font-size:20px;line-height:20px}.nav .sel{color:var(--blue);font-weight:700}@media(min-width:700px){body{padding:24px}.app{border-radius:24px;overflow:hidden;box-shadow:0 8px 35px #17212b1a}}
</style></head>
<body><div class="app"><header class="top"><div class="logo">F</div><div><b>FocusDay</b><small>Gününü odakla</small></div><button class="bell">♧</button></header><main id="main"></main><nav class="nav" id="nav"></nav></div>
<script>
const today=new Date().toISOString().slice(0,10);let goals=JSON.parse(localStorage.getItem('fd-goals')||'null')||[{id:1,title:'Raporu tamamla',done:true,repeat:'Tek seferlik'},{id:2,title:'İngilizce çalış',done:false,repeat:'Her gün'},{id:3,title:'Günlük planı gözden geçir',done:false,repeat:'Her Salı'}];let reminders=JSON.parse(localStorage.getItem('fd-reminders')||'null')||[{id:1,title:'Haftalık toplantı',time:'09:00',repeat:'Her Salı'},{id:2,title:'Faturayı kontrol et',time:'14:30',repeat:'Tek seferlik'}];let screen='home',seconds=1500,running=false,pomos=+localStorage.getItem('fd-pomos')||0,note='';
const save=()=>{localStorage.setItem('fd-goals',JSON.stringify(goals));localStorage.setItem('fd-reminders',JSON.stringify(reminders));localStorage.setItem('fd-pomos',pomos)};const dateText=new Intl.DateTimeFormat('tr-TR',{day:'numeric',month:'long',year:'numeric'}).format(new Date());
function goalRow(g){return `<div class="row"><button class="check ${g.done?'done':''}" onclick="toggle(${g.id})">${g.done?'✓':''}</button><div><strong class="${g.done?'done-text':''}">${g.title}</strong><small>${g.repeat}</small></div></div>`}function reminderRow(r){return `<div class="row"><span class="clock">◷</span><div><strong>${r.title}</strong><small>${r.repeat}</small></div><time>${r.time}</time></div>`}
function home(){let done=goals.filter(g=>g.done).length,p=goals.length?Math.round(done/goals.length*100):0;return `<section class="welcome"><p class="eyebrow">${dateText}</p><h1>Günaydın, Süleyman</h1><p>Bugün neye odaklanmak istersin?</p></section><section class="progress"><div><p class="eyebrow">Bugünkü ilerlemen</p><h2>${done} / ${goals.length} hedef tamamlandı</h2><div class="line"><span style="width:${p}%"></span></div><small>${p}% tamamlandı</small></div><div class="ring" style="--p:${p*3.6}deg"><b>${p}%</b></div></section><section class="card"><div class="heading"><h2>Bugünün hedefleri</h2><button onclick="go('goals')">Tümünü gör</button></div>${goals.slice(0,3).map(goalRow).join('')}</section><section class="card"><div class="heading"><h2>Yaklaşan hatırlatmalar</h2><button onclick="go('reminders')">Tümünü gör</button></div>${reminders.map(reminderRow).join('')}</section><button class="primary wide" onclick="go('pomodoro')">▶ Pomodoro başlat</button>`}
function goalsPage(){return `<div class="title"><h1>Hedefler</h1><button class="plus" onclick="document.querySelector('.add input').focus()">＋</button></div><div class="tabs"><button class="active">Bugün</button><button>Yaklaşan</button><button>Tamamlanan</button></div><section class="card">${goals.map(goalRow).join('')}</section><div class="add"><input placeholder="Yeni hedef yaz..." onkeydown="if(event.key==='Enter')addGoal(this)"><button class="primary" onclick="addGoal(this.previousElementSibling)">Ekle</button></div>`}
function remindersPage(){return `<div class="title"><h1>Yeni Hatırlatma</h1></div><section class="card form"><label>Hatırlatma başlığı</label><input id="rtitle" placeholder="Örn. Haftalık toplantı"><label>Not</label><input placeholder="İsteğe bağlı not"><label>Başlangıç tarihi</label><input type="date" value="${today}"><label>Saat</label><input id="rtime" type="time" value="09:00"><label>Tekrar</label><select><option>Tek seferlik</option><option>Her gün</option><option>Her hafta</option><option>Her ay</option></select><label>Sonlanma</label><select><option>Hiçbir zaman</option><option>Tarihte sona ersin</option><option>Tekrardan sonra sona ersin</option></select><button class="primary wide" onclick="addReminder()">Hatırlatmayı kaydet</button></section><section class="card">${reminders.map(reminderRow).join('')}</section>`}
function pomo(){let m=String(Math.floor(seconds/60)).padStart(2,'0'),s=String(seconds%60).padStart(2,'0');return `<div class="title"><h1>Pomodoro</h1></div><section class="timer"><p class="eyebrow">Bağımsız odaklanma</p><div class="timer-ring"><strong>${m}:${s}</strong><span>${running?'Odaklanıyor':'Başlamaya hazır'}</span></div><input placeholder="Odaklanma konusu (isteğe bağlı)" value="${note}" oninput="note=this.value"><div class="actions"><button class="primary" onclick="run()">${running?'❚❚ Duraklat':'▶ Başlat'}</button><button class="secondary" onclick="resetTimer()">Sıfırla</button></div><p class="session">Tamamlanan Pomodoro: <b>${pomos}</b></p></section>`}
function reports(){let done=goals.filter(g=>g.done).length;return `<div class="title"><h1>Raporlar</h1></div><select class="period"><option>Bu hafta</option><option>Bu ay</option><option>Son 30 gün</option></select><div class="stats"><div class="stat green"><b>${done}</b><small>Tamamlanan hedefler</small></div><div class="stat"><b>${pomos}</b><small>Pomodoro</small></div><div class="stat purple"><b>${pomos*25} dk</b><small>Odaklanma süresi</small></div></div><section class="card"><h2>Haftalık odaklanma</h2><div class="chart">${['Pzt','Sal','Çar','Per','Cum','Cmt','Paz'].map((d,i)=>`<div class="col"><div class="bar b${i%3+1}" style="height:${30+(i*13)%65}%"></div><small>${d}</small></div>`).join('')}</div></section><div class="insight">✦ Bu hafta düzenli ilerliyorsun. Küçük adımlar büyük sonuçlar getirir.</div>`}
function render(){document.getElementById('main').innerHTML=screen==='home'?home():screen==='goals'?goalsPage():screen==='reminders'?remindersPage():screen==='pomodoro'?pomo():reports();let items=[['home','⌂','Ana Sayfa'],['goals','✓','Hedefler'],['reminders','◷','Hatırlatmalar'],['pomodoro','◉','Pomodoro'],['reports','▥','Raporlar']];document.getElementById('nav').innerHTML=items.map(x=>`<button class="${screen===x[0]?'sel':''}" onclick="go('${x[0]}')"><span>${x[1]}</span>${x[2]}</button>`).join('')}
function go(x){screen=x;render()}function toggle(id){goals=goals.map(g=>g.id===id?{...g,done:!g.done}:g);save();render()}function addGoal(el){if(!el.value.trim())return;goals.push({id:Date.now(),title:el.value.trim(),done:false,repeat:'Tek seferlik'});el.value='';save();render()}function addReminder(){let t=document.getElementById('rtitle').value.trim();if(!t)return;reminders.push({id:Date.now(),title:t,time:document.getElementById('rtime').value,repeat:'Tek seferlik'});save();alert('Hatırlatma kaydedildi.');render()}function run(){running=!running;render()}function resetTimer(){running=false;seconds=1500;render()}setInterval(()=>{if(running){seconds--;if(seconds<=0){seconds=1500;running=false;pomos++;save()}render()}},1000);render();
</script></body></html>
