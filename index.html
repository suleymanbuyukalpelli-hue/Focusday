<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0F1218">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="FocusDay">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" href="icons/icon-192.png">
<script>try{var t=(JSON.parse(localStorage.getItem("focusday.v1"))||{}).settings;document.documentElement.dataset.theme=(t&&t.theme)||"dark"}catch(e){document.documentElement.dataset.theme="dark"}</script>
<link rel="stylesheet" href="styles.css">
<title>FocusDay</title>
</head>
<body>
<main id="view"></main>
<div id="toast" role="status" aria-live="polite"></div>
<nav id="nav" aria-label="Main menu"></nav>
<script src="app.js"></script>
</body>
</html>
